<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Immediate Theme Initializer (Prevents Theme Flash & Enforces Persistence) -->
  <script>
    (function() {
      var t = localStorage.getItem('AURELIA_THEME_V4') || localStorage.getItem('AE_V3_THEME') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Chuyển Hướng Phòng Đấu Giá • AUCTIONENGINE</title>
  <script src="js/app-core.js?v=5.1"></script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var roomParam = params.get('room') || params.get('id') || params.get('lot') || '839201';
      var store = window.AureliaApp || window.AuctionStore;
      var room = store ? store.getRoom(roomParam) : null;
      var targetPin = room ? room.roomPin : roomParam;
      window.location.replace('live-room.html?room=' + encodeURIComponent(targetPin));
    })();
  </script>
</head>
<body style="background: #F7F6F2; color: #111315; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
  <div>
    <h2 style="font-size: 1.25rem; color: #111315; margin: 0 0 8px;">Đang kết nối phòng đấu giá trực tiếp...</h2>
    <p style="color: #525866; font-size: 0.85rem;">Đang đưa bạn vào sàn đấu giá AUCTIONENGINE...</p>
    <a href="live-room.html" style="color: #0F172A; text-decoration: underline; font-size: 0.8rem; font-weight: 600;">Nhấp vào đây nếu trang không tự chuyển hướng</a>
  </div>
</body>
</html>
