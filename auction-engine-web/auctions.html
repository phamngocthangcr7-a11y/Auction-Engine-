<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Immediate Theme Initializer (Prevents Theme Flash & Enforces Persistence) -->
  <script>
    (function() {
      var t = localStorage.getItem('AURELIA_THEME_V4') || localStorage.getItem('AE_V3_THEME') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="description" content="Khám phá và tra cứu bộ sưu tập đấu giá độc quyền với bộ lọc đa tầng thông minh, sắp xếp linh hoạt và tính năng so sánh đa vật phẩm.">
  <title>Khám Phá Phiên Đấu Giá • AUCTIONENGINE</title>

    <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script>
    window.handleImgError = function(img, title, cat) {
      if (!img) return;
      img.onerror = null;
      var safeTitle = (title || img.alt || 'AUCTION LOT').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var safeCat = (cat || 'PREMIUM LOT').toUpperCase();
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">' +
        '<rect width="100%" height="100%" fill="#F7F6F2"/>' +
        '<rect x="20" y="20" width="760" height="560" fill="none" stroke="#E2E0D8" stroke-width="2"/>' +
        '<text x="400" y="420" font-family="Newsreader, serif" font-size="18" font-weight="600" fill="#525866" letter-spacing="3" text-anchor="middle">' + safeCat + '</text>' +
        '<text x="400" y="460" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="700" fill="#111315" text-anchor="middle">' + (safeTitle.length > 40 ? safeTitle.substring(0, 37) + '...' : safeTitle) + '</text>' +
        '<text x="400" y="500" font-family="JetBrains Mono, monospace" font-size="12" fill="#868C98" text-anchor="middle">AUCTIONENGINE FINE AUCTIONS</text>' +
      '</svg>';
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    };
  </script>

  <style>
  /* Base catalog grid */
  .catalog-layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    gap: var(--space-5);
    align-items: flex-start;
    max-width: 100%;
  }
  .catalog-layout > section {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .filter-mobile-toggle-bar {
    display: none;
  }
  .grid--cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 100%;
  }

  /* Heart Button */
  .lot-card-heart-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lot-card-heart-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    transition: fill 0.2s ease;
  }
  .lot-card-heart-btn.active svg {
    fill: #DC2626 !important;
    stroke: #DC2626 !important;
  }

  /* Desktop and List View */
  .grid--list {
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
  }
  .grid--list .lot-card {
    flex-direction: row !important;
    align-items: stretch !important;
    min-height: 110px !important;
    overflow: hidden !important;
    border-radius: 8px !important;
  }
  .grid--list .lot-card__media {
    width: 130px !important;
    min-width: 130px !important;
    max-width: 130px !important;
    aspect-ratio: auto !important;
    height: 100% !important;
    flex-shrink: 0 !important;
  }
  .grid--list .lot-card__body {
    padding: 10px 14px !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    flex: 1 !important;
    overflow: hidden !important;
  }
  .grid--list .lot-card__title {
    font-size: 0.9rem !important;
    line-height: 1.3 !important;
    margin-bottom: 4px !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }
  .grid--list .lot-card__data-strip {
    display: flex !important;
    flex-direction: row !important;
    justify-content: space-between !important;
    align-items: center !important;
    margin-bottom: 0 !important;
    padding-top: 0 !important;
    border-top: none !important;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
  }
  .grid--list .lot-card__action-btn {
    width: auto !important;
    padding: 6px 14px !important;
    display: inline-flex !important;
    align-self: flex-end !important;
    margin-top: 4px !important;
  }

  /* Mobile Responsive Overrides (< 960px) */
  @media (max-width: 960px) {
    .catalog-layout {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: var(--space-4) !important;
    }
    .filter-mobile-toggle-bar {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: var(--space-3);
      cursor: pointer;
      user-select: none;
    }
    .filter-mobile-toggle-bar span {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-mobile-toggle-bar svg {
      transition: transform 0.25s ease;
    }
    .filter-mobile-toggle-bar.open svg {
      transform: rotate(180deg);
    }
    .filter-sidebar {
      display: none;
      margin-bottom: var(--space-4);
    }
    .filter-sidebar.open {
      display: block !important;
    }
    .category-pills-bar {
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px !important;
    }
    .btn-cat-pill {
      white-space: nowrap !important;
      flex-shrink: 0 !important;
    }

    /* 2-COLUMN COMPACT MOBILE GRID */
    .grid--cards {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
    }
    .lot-card {
      min-width: 0 !important;
      max-width: 100% !important;
      border-radius: 8px !important;
      overflow: hidden !important;
    }
    .lot-card__media {
      aspect-ratio: 16 / 11 !important;
      width: 100% !important;
      position: relative !important;
    }
    .lot-card__top-overlay {
      top: 6px !important;
      left: 6px !important;
      right: 38px !important; /* leave room for top-right heart */
      gap: 4px !important;
    }
    .lot-card__top-overlay .badge {
      font-size: 0.55rem !important;
      padding: 2px 4px !important;
      letter-spacing: 0 !important;
      line-height: 1.15 !important;
    }
    .lot-card-pin-badge {
      display: none !important; /* Hide PIN badge from overlay on mobile 2-col to avoid overcrowding */
    }
    .lot-card-heart-btn {
      width: 24px !important;
      height: 24px !important;
      top: 6px !important;
      right: 6px !important;
      left: auto !important;
    }
    .lot-card-heart-btn svg {
      width: 11px !important;
      height: 11px !important;
    }
    .lot-card__body {
      padding: 6px 8px 8px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      flex: 1 !important;
      min-width: 0 !important;
    }
    .lot-card__category {
      font-size: 0.62rem !important;
      margin-bottom: 2px !important;
      letter-spacing: 0.02em !important;
      font-weight: 700 !important;
      color: var(--text-muted) !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .lot-card__title {
      font-size: 0.76rem !important;
      line-height: 1.25 !important;
      margin: 0 0 5px 0 !important;
      display: -webkit-box !important;
      -webkit-line-clamp: 2 !important;
      -webkit-box-orient: vertical !important;
      overflow: hidden !important;
      min-height: 1.9rem !important;
      max-height: 1.9rem !important;
    }
    .lot-card__title a {
      font-size: 0.76rem !important;
      line-height: 1.25 !important;
    }
    .lot-card__data-strip {
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
      margin-bottom: 6px !important;
      padding: 4px 6px !important;
      border-radius: 4px !important;
      background: var(--bg-page) !important;
      border: 1px solid var(--border-color) !important;
      min-width: 0 !important;
    }
    .lot-card__data-strip > div:last-child {
      text-align: left !important;
    }
    .lot-card__data-label {
      font-size: 0.55rem !important;
      margin-bottom: 0 !important;
      color: var(--text-muted) !important;
      text-transform: uppercase !important;
    }
    .lot-card__price {
      font-size: 0.8rem !important;
      line-height: 1.15 !important;
      color: #10B981 !important;
      font-weight: 700 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    .lot-card__timer {
      font-size: 0.68rem !important;
      font-family: var(--font-mono) !important;
      color: var(--text-primary) !important;
    }
    .lot-card__action-btn {
      padding: 5px 6px !important;
      font-size: 0.7rem !important;
      border-radius: 4px !important;
      gap: 3px !important;
      width: 100% !important;
      text-align: center !important;
      justify-content: center !important;
    }
    .lot-card__action-btn svg {
      width: 11px !important;
      height: 11px !important;
    }

    /* List view on mobile */
    .grid--list .lot-card {
      min-height: 95px !important;
      max-height: 115px !important;
    }
    .grid--list .lot-card__media {
      width: 95px !important;
      min-width: 95px !important;
      max-width: 95px !important;
    }
    .grid--list .lot-card__body {
      padding: 6px 10px !important;
    }
    .grid--list .lot-card__title {
      font-size: 0.78rem !important;
      min-height: auto !important;
      max-height: none !important;
    }
    .grid--list .lot-card__data-strip {
      flex-direction: row !important;
      justify-content: space-between !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }
    .grid--list .lot-card__action-btn {
      width: auto !important;
      padding: 4px 8px !important;
      font-size: 0.68rem !important;
    }
  }
</style>
</head>
<body>
  <!-- Header Root -->
  <div id="site-header-root"></div>

  <!-- MAIN CATALOG CONTENT -->
  <main class="page-body" style="padding-top: var(--space-4); padding-bottom: var(--space-8);">
    <div class="container container--wide">
      
      <!-- Breadcrumb -->
      <nav aria-label="Breadcrumb" style="margin-bottom: var(--space-3); font-size: 0.78rem; color: var(--text-muted);">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none;">AUCTIONENGINE</a>
        <span style="margin: 0 6px;">/</span>
        <span style="color: var(--text-primary); font-weight: 600;">Danh Mục Đấu Giá</span>
      </nav>

      <!-- Mobile Filter Toggle Button -->
      <div class="filter-mobile-toggle-bar" id="btn-toggle-mobile-filter" onclick="window.toggleMobileFilters()">
        <span>
          <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; color: #059669;"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
          Bộ Lọc & Tìm Kiếm Đa Tầng (Chạm để mở/đóng)
        </span>
        <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--text-muted);"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>

      <div class="catalog-layout">
        
        <!-- 1. ASIDE: FILTER SIDEBAR -->
        <aside class="filter-sidebar" aria-label="Bộ lọc đa tầng" style="background: var(--bg-surface); border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); padding: var(--space-4); height: fit-content;">
          <div class="flex items-center justify-between" style="padding-bottom: var(--space-3); border-bottom: 1px solid var(--border-hairline); margin-bottom: var(--space-4);">
            <h3 style="font-size: 0.95rem; font-weight: 700; margin: 0; color: var(--text-primary);">Bộ Lọc</h3>
            <button type="button" id="btn-reset-filters" class="btn btn--outline btn--sm" style="font-size: 0.72rem; padding: 2px 8px;">
              Đặt lại
            </button>
          </div>

          <!-- Keyword Search -->
          <div class="filter-group" style="margin-bottom: var(--space-4);">
            <h4 style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px;">
              Tìm kiếm từ khóa
            </h4>
            <div style="position: relative;">
              <input 
                type="search" 
                id="catalog-search-input" 
                class="form-control" 
                placeholder="Tên phiên, hãng, mã PIN..."
                style="padding-left: 2rem; font-size: 0.8rem;"
              />
              <svg viewBox="0 0 24 24" style="position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
          </div>

          <!-- Category Checkboxes -->
          <div class="filter-group" style="margin-bottom: var(--space-4);">
            <h4 style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px;">
              Danh mục tài sản
            </h4>
            <div class="filter-checkbox-list" style="display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem;">
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="cat" value="watches" checked style="accent-color: var(--accent-primary);">
                <span>Đồng hồ Cơ Thụy Sĩ</span>
              </label>
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="cat" value="hypercars" checked style="accent-color: var(--accent-primary);">
                <span>Siêu xe & Mô tô hiếm</span>
              </label>
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="cat" value="tech" checked style="accent-color: var(--accent-primary);">
                <span>Công nghệ & Bản mẫu</span>
              </label>
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="cat" value="art" checked style="accent-color: var(--accent-primary);">
                <span>Tranh Nghệ Thuật</span>
              </label>
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="cat" value="antiques" checked style="accent-color: var(--accent-primary);">
                <span>Đồ Cổ & Cổ Vật</span>
              </label>
            </div>
          </div>

          <!-- Status Checkboxes -->
          <div class="filter-group" style="margin-bottom: var(--space-4);">
            <h4 style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px;">
              Trạng thái phiên
            </h4>
            <div class="filter-checkbox-list" style="display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem;">
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="status" value="LIVE" checked style="accent-color: var(--accent-primary);">
                <span class="badge badge--live" style="font-size: 0.62rem; padding: 2px 6px;">LIVE</span>
                <span>Đang diễn ra</span>
              </label>
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="status" value="WAITING" checked style="accent-color: var(--accent-primary);">
                <span class="badge badge--waiting" style="font-size: 0.62rem; padding: 2px 6px;">WAITING</span>
                <span>Chờ khai mạc</span>
              </label>
              <label class="flex items-center gap-2" style="cursor: pointer;">
                <input type="checkbox" name="status" value="ENDED" checked style="accent-color: var(--accent-primary);">
                <span class="badge badge--ended" style="font-size: 0.62rem; padding: 2px 6px;">ENDED</span>
                <span>Đã kết thúc</span>
              </label>
            </div>
          </div>

          <!-- Price Range Filter -->
          <div class="filter-group">
            <h4 style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px;">
              Khoảng giá (VNĐ)
            </h4>
            <div style="display: flex; gap: 6px; align-items: center;">
              <input type="number" id="filter-price-min" class="form-control" placeholder="Tối thiểu" value="0" style="font-size: 0.75rem; padding: 6px 8px;">
              <span style="color: var(--text-muted);">-</span>
              <input type="number" id="filter-price-max" class="form-control" placeholder="Không giới hạn" value="" style="font-size: 0.75rem; padding: 6px 8px;">
            </div>
          </div>
        </aside>

        <!-- 2. MAIN RESULTS AREA -->
        <section aria-label="Danh sách kết quả đấu giá">
          <!-- Toolbar -->
          <div class="flex items-center justify-between" style="background: var(--bg-surface); border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: var(--space-4); flex-wrap: wrap; gap: var(--space-2);">
            <div>
              <span style="font-size: 0.85rem; color: var(--text-secondary);">
                Hiển thị <strong id="catalog-count-display" class="font-mono text-primary">0</strong> phiên đấu giá
              </span>
            </div>

            <div class="flex items-center gap-3">
              <!-- Sort Select -->
              <div class="flex items-center gap-2">
                <label for="catalog-sort-select" style="font-size: 0.75rem; color: var(--text-muted);">Sắp xếp:</label>
                <select id="catalog-sort-select" class="form-control" style="width: auto; padding: 4px 8px; font-size: 0.75rem;">
                  <option value="endingSoonest">Sắp kết thúc sớm nhất</option>
                  <option value="priceDesc">Giá cao nhất</option>
                  <option value="priceAsc">Giá thấp nhất</option>
                </select>
              </div>

              <!-- View Mode Toggle with Clean SVGs -->
              <div class="flex gap-1" role="group" aria-label="Chế độ xem">
                <button type="button" id="btn-view-grid" class="btn btn--outline btn--sm" style="padding: 4px 8px;" title="Xem dạng lưới">
                  <svg viewBox="0 0 24 24" style="width: 14px; height: 14px;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </button>
                <button type="button" id="btn-view-list" class="btn btn--outline btn--sm" style="padding: 4px 8px;" title="Xem dạng danh sách">
                  <svg viewBox="0 0 24 24" style="width: 14px; height: 14px;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Interactive Category Pills -->
          <div class="category-pills-bar" style="display: flex; gap: 8px; margin-bottom: var(--space-4); overflow-x: auto; padding-bottom: 4px; flex-wrap: wrap;">
            <button type="button" class="btn-cat-pill active" data-cat="all" style="padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--accent-navy); color: #FFFFFF; transition: all 0.2s ease;">
              Tất Cả (8)
            </button>
            <button type="button" class="btn-cat-pill" data-cat="watches" style="padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary); transition: all 0.2s ease;">
              Đồng Hồ Thụy Sĩ (3)
            </button>
            <button type="button" class="btn-cat-pill" data-cat="hypercars" style="padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary); transition: all 0.2s ease;">
              Siêu Xe & Xe Cổ Điển (3)
            </button>
            <button type="button" class="btn-cat-pill" data-cat="tech" style="padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary); transition: all 0.2s ease;">
              Công Nghệ & Bản Mẫu (1)
            </button>
            <button type="button" class="btn-cat-pill" data-cat="art" style="padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary); transition: all 0.2s ease;">
              Tranh Nghệ Thuật (1)
            </button>
            <button type="button" class="btn-cat-pill" data-cat="antiques" style="padding: 6px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-secondary); transition: all 0.2s ease;">
              Đồ Cổ & Cổ Vật (1)
            </button>
          </div>

          <!-- Items Container -->
          <div id="catalog-items-container" class="grid grid--cards"></div>

          <!-- Empty State -->
          <div id="catalog-empty-state" style="display: none; padding: 48px; text-align: center; background: var(--bg-surface); border-radius: var(--radius-sm); border: 1px dashed var(--border-hairline);">
            <h3 style="font-size: 1.1rem; margin-bottom: 6px; color: var(--text-primary);">Không tìm thấy phiên phù hợp</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: var(--space-4);">
              Hãy thử điều chỉnh lại bộ lọc từ khóa, khoảng giá hoặc trạng thái phiên.
            </p>
            <button type="button" id="btn-clear-empty-filter" class="btn btn--primary btn--sm">Đặt Lại Bộ Lọc</button>
          </div>
        </section>
      </div>

    </div>
  </main>

  <!-- Footer Root -->
  <div id="site-footer-root"></div>

  <!-- Modals Root -->
  <div id="modals-root"></div>

  <!-- Scripts -->
  <script src="js/mqtt.min.js?v=5.1"></script>
  <script src="js/app-core.js?v=5.1"></script>
  <script src="components/header.js?v=5.1"></script>
  <script src="components/footer.js?v=5.1"></script>
  <script src="components/modals.js?v=5.1"></script>

  <script>
    (function() {
      if (typeof window.renderHeader === 'function') window.renderHeader();
      if (typeof window.renderFooter === 'function') window.renderFooter();
      if (typeof window.renderModals === 'function') window.renderModals();

      var store = window.AureliaApp || window.AuctionStore;
      if (!store) return;

      var currentViewMode = 'grid';
      var gridBtn = document.getElementById('btn-view-grid');
      var listBtn = document.getElementById('btn-view-list');
      var container = document.getElementById('catalog-items-container');

      function setViewMode(mode) {
        currentViewMode = mode;
        if (mode === 'grid') {
          container.className = 'grid grid--cards';
          if (gridBtn) { gridBtn.style.background = 'var(--text-primary)'; gridBtn.style.color = 'var(--bg-page)'; }
          if (listBtn) { listBtn.style.background = 'transparent'; listBtn.style.color = 'var(--text-secondary)'; }
        } else {
          container.className = 'grid grid--list';
          if (listBtn) { listBtn.style.background = 'var(--text-primary)'; listBtn.style.color = 'var(--bg-page)'; }
          if (gridBtn) { gridBtn.style.background = 'transparent'; gridBtn.style.color = 'var(--text-secondary)'; }
        }
        renderCatalog();
      }

      if (gridBtn) gridBtn.addEventListener('click', function() { setViewMode('grid'); });
      if (listBtn) listBtn.addEventListener('click', function() { setViewMode('list'); });

      // Synchronize Category Pills & URL
      function syncCatPillUI(activeCat) {
        document.querySelectorAll('.btn-cat-pill').forEach(function(pill) {
          var isMatch = pill.getAttribute('data-cat') === activeCat;
          if (isMatch) {
            pill.style.background = 'var(--accent-navy)';
            pill.style.color = '#FFFFFF';
            pill.style.borderColor = 'var(--accent-navy)';
            pill.classList.add('active');
          } else {
            pill.style.background = 'var(--bg-surface)';
            pill.style.color = 'var(--text-secondary)';
            pill.style.borderColor = 'var(--border-color)';
            pill.classList.remove('active');
          }
        });
      }

      var urlParams = new URLSearchParams(window.location.search);
      var paramCat = urlParams.get('category');
      if (paramCat) {
        document.querySelectorAll('input[name="cat"]').forEach(function(cb) {
          cb.checked = (cb.value === paramCat);
        });
        syncCatPillUI(paramCat);
      } else {
        syncCatPillUI('all');
      }

      document.querySelectorAll('.btn-cat-pill').forEach(function(pill) {
        pill.addEventListener('click', function() {
          var cat = pill.getAttribute('data-cat');
          if (cat === 'all') {
            document.querySelectorAll('input[name="cat"]').forEach(function(cb) { cb.checked = true; });
            try { history.replaceState(null, '', 'auctions.html'); } catch(e) {}
          } else {
            document.querySelectorAll('input[name="cat"]').forEach(function(cb) {
              cb.checked = (cb.value === cat);
            });
            try { history.replaceState(null, '', 'auctions.html?category=' + cat); } catch(e) {}
          }
          syncCatPillUI(cat);
          renderCatalog();
        });
      });

      function renderCatalog() {
        var rooms = store.getRooms();
        var searchKeyword = (document.getElementById('catalog-search-input').value || '').trim().toLowerCase();
        var checkedCats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(function(cb) { return cb.value; });
        var checkedStatuses = Array.from(document.querySelectorAll('input[name="status"]:checked')).map(function(cb) { return cb.value; });
        var minPrice = Number(document.getElementById('filter-price-min').value) || 0;
        var maxPrice = Number(document.getElementById('filter-price-max').value) || Infinity;
        var sortCriterion = document.getElementById('catalog-sort-select').value;

        var filtered = rooms.filter(function(r) {
          var price = r.currentPrice || r.startPrice || 0;
          if (searchKeyword && !r.title.toLowerCase().includes(searchKeyword) && !(r.roomPin && r.roomPin.includes(searchKeyword)) && !(r.categoryName && r.categoryName.toLowerCase().includes(searchKeyword))) {
            return false;
          }
          if (checkedCats.length > 0 && !checkedCats.includes(r.category)) return false;
          var effStatus = (r.status === 'PENDING_APPROVAL') ? 'WAITING' : r.status;
          if (checkedStatuses.length > 0 && !checkedStatuses.includes(effStatus) && !checkedStatuses.includes(r.status)) return false;
          if (price < minPrice || (maxPrice < Infinity && price > maxPrice)) return false;
          return true;
        });

        if (sortCriterion === 'priceDesc') {
          filtered.sort(function(a, b) { return (b.currentPrice || b.startPrice || 0) - (a.currentPrice || a.startPrice || 0); });
        } else if (sortCriterion === 'priceAsc') {
          filtered.sort(function(a, b) { return (a.currentPrice || a.startPrice || 0) - (b.currentPrice || b.startPrice || 0); });
        } else {
          filtered.sort(function(a, b) { return new Date(a.endTime || 0).getTime() - new Date(b.endTime || 0).getTime(); });
        }

        var countEl = document.getElementById('catalog-count-display');
        if (countEl) countEl.textContent = filtered.length;

        var emptyState = document.getElementById('catalog-empty-state');
        if (filtered.length === 0) {
          container.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        container.innerHTML = filtered.map(function(room) {
          var remainingMs = room.endTime ? Math.max(0, new Date(room.endTime).getTime() - Date.now()) : 0;
          var totalSecs = Math.floor(remainingMs / 1000);
          var mins = Math.floor(totalSecs / 60);
          var secs = totalSecs % 60;
          
          var timeStr = 'Đã kết thúc';
          if (room.status === 'WAITING') {
            timeStr = 'Chờ khai mạc';
          } else if (room.status === 'LIVE') {
            timeStr = remainingMs > 0 ? (mins + ':' + (secs < 10 ? '0' : '') + secs) : 'Đang chốt phiên';
          }

          var statusBadge = 'badge--waiting';
          var statusText = 'CHỜ MỞ SÀN';
          if (room.status === 'LIVE') {
            statusBadge = 'badge--live';
            statusText = 'ĐANG DIỄN RA';
          } else if (room.status === 'ENDED') {
            statusBadge = 'badge--ended';
            statusText = 'ĐÃ KẾT THÚC';
          }

          var imgUrl = (room.images && room.images[0]) || store.getFallbackImage(room.title, room.categoryName);
          var currentPrice = room.currentPrice || room.startPrice || 0;

          var watchlist = store.getWatchlist ? store.getWatchlist() : [];
          var isHearted = watchlist.indexOf(room.roomId) > -1 || watchlist.indexOf(room.roomPin) > -1;
          return '<article class="lot-card" data-room-pin="' + room.roomPin + '" style="position:relative;">' +
            '<button type="button" class="lot-card-heart-btn ' + (isHearted ? 'active' : '') + '" onclick="event.stopPropagation(); store.toggleWatchlist(\'' + (room.roomId || room.roomPin) + '\'); this.classList.toggle(\'active\');" title="Lưu vào danh sách theo dõi"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></button>' +
            '<div class="lot-card__media">' +
              '<img src="' + imgUrl + '" alt="' + room.title + '" class="lot-card__img" loading="lazy" onerror="if (window.handleImgError) window.handleImgError(this, \'' + room.title.replace(/'/g, "\\'") + '\', \'' + (room.categoryName || '').replace(/'/g, "\\'") + '\');">' +
              '<div class="lot-card__top-overlay">' +
                '<span class="badge ' + statusBadge + '">' + statusText + '</span>' +
                '<span class="badge lot-card-pin-badge" style="background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-hairline); font-family: var(--font-mono); font-weight: 600;">#PIN ' + room.roomPin + '</span>' +
              '</div>' +
            '</div>' +

            '<div class="lot-card__body">' +
              '<div class="lot-card__category">' + (room.categoryName || 'TÀI SẢN CAO CẤP') + '</div>' +
              '<h3 class="lot-card__title">' +
                '<a href="live-room.html?room=' + room.roomPin + '">' + room.title + '</a>' +
              '</h3>' +

              '<div class="lot-card__data-strip">' +
                '<div>' +
                  '<div class="lot-card__data-label">' + (room.status === 'WAITING' ? 'Giá khởi điểm' : 'Giá hiện tại') + '</div>' +
                  '<div class="lot-card__price price-val font-mono" style="white-space:nowrap;">' + store.formatCurrency(currentPrice) + '</div>' +
                '</div>' +
                '<div class="lot-card__data-timer-col">' +
                  '<div class="lot-card__data-label">' + (room.status === 'WAITING' ? 'Thời lượng' : 'Thời gian') + '</div>' +
                  '<div class="lot-card__timer">' + timeStr + '</div>' +
                '</div>' +
              '</div>' +

              '<a href="live-room.html?room=' + room.roomPin + '" class="lot-card__action-btn">' +
                '<span>Vào Phòng Đấu Giá</span>' +
                '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>' +
              '</a>' +
            '</div>' +
          '</article>';
        }).join('');
      }

      // Live countdown loop
      setInterval(function() {
        var rooms = store.getRooms();
        rooms.forEach(function(r) {
          var card = document.querySelector('.lot-card[data-room-pin="' + r.roomPin + '"]');
          if (card) {
            var timerEl = card.querySelector('.lot-card__timer');
            if (timerEl) {
              if (r.status === 'WAITING') {
                timerEl.textContent = 'Chờ khai mạc';
              } else if (r.status === 'ENDED') {
                timerEl.textContent = 'Đã kết thúc';
              } else if (r.endTime) {
                var diff = Math.max(0, new Date(r.endTime).getTime() - Date.now());
                var totalSec = Math.floor(diff / 1000);
                var m = Math.floor(totalSec / 60);
                var s = totalSec % 60;
                timerEl.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
              }
            }
          }
        });
      }, 1000);

      // Event bindings
      var searchInput = document.getElementById('catalog-search-input');
      var debounceTimer = null;
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(renderCatalog, 250);
        });
      }

      ['filter-price-min', 'filter-price-max', 'catalog-sort-select'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', renderCatalog);
      });

      document.querySelectorAll('input[name="cat"], input[name="status"]').forEach(function(el) {
        el.addEventListener('change', function() {
          var checkedCats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(function(cb) { return cb.value; });
          if (checkedCats.length === 1) {
            syncCatPillUI(checkedCats[0]);
          } else if (checkedCats.length === 4) {
            syncCatPillUI('all');
          } else {
            syncCatPillUI('');
          }
          renderCatalog();
        });
      });

      var resetBtn = document.getElementById('btn-reset-filters');
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          if (searchInput) searchInput.value = '';
          document.querySelectorAll('input[name="cat"], input[name="status"]').forEach(function(cb) { cb.checked = true; });
          document.getElementById('filter-price-min').value = 0;
          document.getElementById('filter-price-max').value = '';
          document.getElementById('catalog-sort-select').value = 'endingSoonest';
          syncCatPillUI('all');
          try { history.replaceState(null, '', 'auctions.html'); } catch(e) {}
          renderCatalog();
        });
      }

      var clearEmptyBtn = document.getElementById('btn-clear-empty-filter');
      if (clearEmptyBtn) clearEmptyBtn.addEventListener('click', function() { resetBtn.click(); });

      // Initial Mount
      setViewMode('grid');

      store.subscribe(function() {
        renderCatalog();
      });

    })();
  </script>
  <script>
    window.toggleMobileFilters = function() {
      var bar = document.getElementById('btn-toggle-mobile-filter');
      var sidebar = document.querySelector('.filter-sidebar');
      if (bar && sidebar) {
        bar.classList.toggle('open');
        sidebar.classList.toggle('open');
      }
    };
  </script>
</body>
</html>
